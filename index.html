<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平滑动标签页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条但保留滑动功能 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-sm mx-auto bg-white p-4 rounded-xl shadow-lg">
        <h2 class="text-lg font-bold mb-4">热门标签</h2>
        
        <!-- 容器：固定宽度并允许横向滚动 -->
        <div class="overflow-x-auto scrollbar-hide flex gap-2 pb-2">
            <!-- 标签列表：强制不换行 -->
            <div class="flex gap-2 whitespace-nowrap">
                <span class="px-4 py-1.5 bg-blue-100 text-blue-600 rounded-full text-sm font-medium">JavaScript</span>
                <span class="px-4 py-1.5 bg-green-100 text-green-600 rounded-full text-sm font-medium">React</span>
                <span class="px-4 py-1.5 bg-purple-100 text-purple-600 rounded-full text-sm font-medium">Tailwind CSS</span>
                <span class="px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full text-sm font-medium">HTML5</span>
                <span class="px-4 py-1.5 bg-pink-100 text-pink-600 rounded-full text-sm font-medium">TypeScript</span>
                <span class="px-4 py-1.5 bg-teal-100 text-teal-600 rounded-full text-sm font-medium">CSS Grid</span>
            </div>
        </div>
    </div>

</body>
</html>
